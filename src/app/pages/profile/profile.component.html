<div class="layout">
  <app-sidebar></app-sidebar>

  <main class="content">
    <header class="page-header">
      <h2>My Profile</h2>
      <p>Manage your account settings</p>
    </header>

    <div class="profile-container">

      <div class="profile-card">
        <div class="avatar-large">
            {{ editData.name.charAt(0).toUpperCase() }}
        </div>
        <div class="role-badge">{{ user.role }}</div>

        <form (ngSubmit)="saveProfile()">
            <div class="form-group">
                <label>Full Name</label>
                <input [(ngModel)]="editData.name" name="name" class="form-control">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email (Read Only)</label>
                    <input [value]="editData.email" disabled class="form-control disabled">
                </div>
                <div class="form-group">
                    <label>Student ID (Read Only)</label>
                    <input [value]="editData.studentId" disabled class="form-control disabled">
                </div>
            </div>

            <hr>
            <h4>Change Password</h4>
            <p class="text-muted small">Leave blank if you don't want to change it.</p>

            <div class="form-row">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" [(ngModel)]="editData.password" name="pass" class="form-control" placeholder="••••••">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" [(ngModel)]="editData.confirmPassword" name="confPass" class="form-control" placeholder="••••••">
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn-primary" [disabled]="isSaving">
                    {{ isSaving ? 'Saving...' : 'Update Profile' }}
                </button>
            </div>
        </form>
      </div>

    </div>
  </main>
</div>
