<div class="layout" *ngIf="userRole === 'admin'">
  <app-sidebar></app-sidebar>

  <main class="content">
    <header class="page-header">
      <div>
        <h2>User Management</h2>
        <p>Manage student access, approvals, and accounts.</p>
      </div>
    </header>

    <div class="controls-bar">

      <div class="tabs">
        <button [class.active]="currentTab === 'active'" (click)="switchTab('active')">
          <i class="fas fa-user-check"></i> Active Users
        </button>
        <button [class.active]="currentTab === 'pending'" (click)="switchTab('pending')">
          <i class="fas fa-user-clock"></i> Requests
          <span class="badge-count" *ngIf="allUsers.length > 0 && currentTab === 'pending'">{{ allUsers.length }}</span>
        </button>
        <button [class.active]="currentTab === 'deleted'" (click)="switchTab('deleted')">
          <i class="fas fa-user-times"></i> Deleted
        </button>
      </div>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search name or ID..." [(ngModel)]="searchTerm" (input)="applyFilter()">
      </div>

    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name / Email</th>
            <th>Student ID</th>
            <th>Role</th>
            <th>Status</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of filteredUsers">

            <td>
              <div class="user-info">
                <div class="avatar-small">{{ user.name.charAt(0) }}</div>
                <div>
                  <div class="font-bold">{{ user.name }}</div>
                  <div class="text-muted small">{{ user.email }}</div>
                </div>
              </div>
            </td>

            <td><span class="id-badge">{{ user.studentId }}</span></td>
            <td>{{ user.role }}</td>

            <td>
              <span class="badge"
                [ngClass]="{
                  'badge-green': user.status === 'active',
                  'badge-orange': user.status === 'pending',
                  'badge-red': user.isDeleted
                }">
                {{ user.isDeleted ? 'Deleted' : (user.status | titlecase) }}
              </span>
            </td>

            <td class="text-right">

              <button *ngIf="currentTab === 'active'" class="btn-icon delete" (click)="deactivateUser(user.id)" title="Deactivate User">
                <i class="fas fa-ban"></i>
              </button>

              <div *ngIf="currentTab === 'pending'" class="action-group">
                <button class="btn-sm btn-approve" (click)="approveUser(user)">Approve</button>
                <button class="btn-sm btn-reject" (click)="rejectUser(user)">Reject</button>
              </div>

              <button *ngIf="currentTab === 'deleted'" class="btn-sm btn-recover" (click)="recoverUser(user.id)">
                <i class="fas fa-undo"></i> Recover
              </button>

            </td>
          </tr>

          <tr *ngIf="filteredUsers.length === 0">
            <td colspan="5" class="empty-state">
              <i class="fas fa-users-slash"></i>
              <p>No users found in this list.</p>
            </td>
          </tr>

        </tbody>
      </table>
    </div>

  </main>
</div>
