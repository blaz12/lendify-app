<div class="login-container">
  <div class="login-card">

    <h1>Lendify</h1>
    <p>{{ isRegisterMode ? 'Student Registration' : 'Campus Inventory System' }}</p>

    <div class="alert error" *ngIf="errorMessage">
      <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
    </div>
    <div class="alert success" *ngIf="successMessage">
      <i class="fas fa-check-circle"></i> {{ successMessage }}
    </div>

    <form *ngIf="!isRegisterMode" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="loginData.email" name="email" class="form-control" placeholder="user@lendify.edu" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="loginData.password" name="password" class="form-control" placeholder="••••••" required>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Checking...' : 'Login' }}
      </button>

      <div class="toggle-link">
        Don't have an account? <a (click)="isRegisterMode = true; errorMessage=''">Register here</a>
      </div>

      <div class="demo-hint">
        <small><strong>Admin:</strong> admin@lendify.edu</small>
      </div>
    </form>

    <form *ngIf="isRegisterMode" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="registerData.name" name="regName" class="form-control" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Student ID (NIM)</label>
        <input type="text" [(ngModel)]="registerData.studentId" name="regNim" class="form-control" placeholder="12345678" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="registerData.email" name="regEmail" class="form-control" placeholder="john@lendify.edu" required>
      </div>
      <div class="form-group">
        <label>Create Password</label>
        <input type="password" [(ngModel)]="registerData.password" name="regPass" class="form-control" placeholder="••••••" required>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Saving...' : 'Register Account' }}
      </button>

      <div class="toggle-link">
        Already have an account? <a (click)="isRegisterMode = false; errorMessage=''">Login here</a>
      </div>
    </form>

  </div>
</div>
